  <text x="110" y="205" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#315b50" >SECTION A — HORIZONTAL THROUGH SERVICE WALL / LEDGE</text><rect x="130" y="330" width="491.99999999999994" height="180" fill="#d9d9d2" stroke="#343b3a" stroke-width="4" /><rect x="146.4" y="348" width="459.19999999999993" height="144" fill="#ffffff" stroke="#315b50" stroke-width="3" /><rect x="130" y="380" width="16.4" height="80" fill="url(#unknown-hatch)" stroke="#7c8582" stroke-width="2" /><rect x="605.5999999999999" y="380" width="16.4" height="80" fill="url(#unknown-hatch)" stroke="#7c8582" stroke-width="2" /><text x="376" y="422" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#315b50" >56 FINISHED CLEAR</text><text x="376" y="448" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#7c8582" >2 NOMINAL PER SIDE</text><text x="376" y="471" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#7c8582" >ACTUAL CURVED WALL BUILD-UP UNKNOWN</text><rect x="622" y="385" width="122.99999999999999" height="70" fill="#f4ead0" stroke="#b78a32" stroke-width="3" /><text x="683.5" y="416" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" font-weight="700" fill="#b78a32" >15 NOM.</text><text x="683.5" y="436" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" font-weight="700" fill="#b78a32" >LEDGE</text><text x="683.5" y="476" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#a33f36" >EXTERIOR ONLY</text><line x1="130" y1="550" x2="622" y2="550" stroke="#7c8582" stroke-width="1.5" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>
