    <text x="376" y="541" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#7c8582" >60 EXTERIOR BODY — DESIGN ASSUMPTION</text><text x="376" y="595" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" font-weight="700" fill="#a33f36" >HATCH / LEDGE / FLASHING / SUPPORTS: ZERO INTRUSION INTO 56-INCH CLEAR WIDTH</text><text x="865" y="205" font-family="Arial,Helvetica,sans-serif" font-size="17" text-anchor="start" font-weight="700" fill="#315b50" >SECTION B — VERTICAL THROUGH SERVICE OPENING</text><rect x="990" y="251.2" width="250" height="478.8" fill="#d9d9d2" stroke="#343b3a" stroke-width="4" /><rect x="1018" y="296.8" width="194" height="433.2" fill="#ffffff" stroke="#315b50" stroke-width="3" /><rect x="1002" y="327.8" width="226" height="26" fill="url(#infill-hatch)" stroke="#47745f" stroke-width="2" /><rect x="1002" y="524.8" width="226" height="26" fill="url(#infill-hatch)" stroke="#47745f" stroke-width="2" /><rect x="1018" y="353.8" width="194" height="170.99999999999994" fill="#fffdf8" stroke="#a33f36" stroke-width="4" stroke-dasharray="14 8"/><text x="1115" y="433.29999999999995" font-family="Arial,Helvetica,sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#a33f36" >30 MAX</text><text x="1115" y="457.29999999999995" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#a33f36" >OPENING</text><path d="M 1018 353.8 L 1115 258.8 L 1212 353.8" fill="#f4ead0" stroke="#b78a32" stroke-width="3" stroke-dasharray="9 6"/><text x="1115" y="243.8" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#b78a32" >HATCH OPERATING ENVELOPE</text><rect x="1212" y="532.8" width="100" height="30" fill="#f4ead0" stroke="#b78a32" stroke-width="2" /><text x="1262" y="553.8" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#b78a32" >LEDGE