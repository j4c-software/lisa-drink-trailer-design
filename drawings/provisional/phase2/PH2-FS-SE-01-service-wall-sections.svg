  <text x="72" y="124" font-family="Arial,Helvetica,sans-serif" font-size="15" text-anchor="start" font-weight="400" fill="#343b3a" >FINISHED-CLEAR BOUNDARY, SYMBOLIC STRUCTURAL RESERVES AND EXTERIOR-ONLY HATCH / LEDGE ENVELOPES</text>
