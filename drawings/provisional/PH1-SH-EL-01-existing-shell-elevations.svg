    <text x="1384" y="1183" class="t orange small" font-weight="700" text-anchor="middle">≈78&quot; OVER FENDERS • PHOTO EST.</text>
    <line x1="1640" y1="722" x2="1640" y2="1114" class="dim"/>
    <line x1="1617" y1="722" x2="1651" y2="722" class="ext"/><line x1="1617" y1="1114" x2="1651" y2="1114" class="ext"/>
    <text x="1663" y="921" class="t gray label" text-anchor="middle" transform="rotate(90 1663 921)">81.6&quot; HEIGHT • LISTED</text>
