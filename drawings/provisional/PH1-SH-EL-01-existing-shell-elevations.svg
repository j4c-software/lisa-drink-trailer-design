    <text x="1384" y="490" class="t rust tiny" text-anchor="middle">ROUNDED SIDE TRANSITIONS • RADIUS UNKNOWN</text>
    <line x1="1240" y1="635" x2="1528" y2="635" class="dim"/>
    <line x1="1240" y1="610" x2="1240" y2="646" class="ext"/><line x1="1528" y1="610" x2="1528" y2="646" class="ext"/>
    <text x="1384" y="628" class="t gray label" text-anchor="middle">60&quot; BODY WIDTH • LISTED</text>
    <line x1="1570" y1="202" x2="1570" y2="594" class="dim"/>
    <line x1="1547" y1="202" x2="1581" y2="202" class="ext"/><line x1="1547" y1="594" x2="1581" y2="594" class="ext"/>
    <text x="1593" y="401" class="t gray label" text-anchor="middle" transform="rotate(90 1593 401)">81.6&quot; HEIGHT • LISTED</text>
  </g>

