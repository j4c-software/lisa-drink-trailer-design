    <rect x="1394" y="770" width="100" height="126" fill="url(#bars)" stroke="#68706d" stroke-width="3"/>
    <line x1="1264" y1="920" x2="1504" y2="920" class="trim"/>
    <circle cx="1373" cy="968" r="5" fill="#2e3232"/><circle cx="1395" cy="968" r="5" fill="#2e3232"/>
