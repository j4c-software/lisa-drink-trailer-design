  <line x1="72" y1="1218" x2="1728" y2="1218" stroke="#2e3232" stroke-width="1"/>
  <text x="72" y="1248" class="t rust small" font-weight="700">DRAFT • GATE 1 PENDING • EXISTING SHELL ONLY • NO FABRICATION MODIFICATIONS • NOT FOR FABRICATION</text>
  <text x="1728" y="1248" class="t gray small" text-anchor="end">LISTED DIMENSIONS + PHOTO ESTIMATES • VERIFY ON ACQUIRED TRAILER</text>
</svg>
