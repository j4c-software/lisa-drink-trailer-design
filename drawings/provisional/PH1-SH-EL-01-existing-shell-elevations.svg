<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
  <title id="title">Phase 1 Existing Reference Shell Exterior Elevations</title>
  <desc id="desc">Four orthographic exterior elevations of the unmodified representative 1989 Circle J two-horse trailer shell: curb side, street side, front, and rear. Listed dimensions and photo-estimated original openings and running gear are separated. No conversion or fabrication modifications are shown.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#68706d"/>
    </marker>
    <pattern id="bars" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="6" y1="0" x2="6" y2="12" stroke="#68706d" stroke-width="2" opacity="0.65"/>
    </pattern>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#2e3232}.green{fill:#315b50}.rust{fill:#9a4d43}.orange{fill:#b56f4c}.gray{fill:#68706d}
      .outline{fill:#f4efe5;stroke:#2e3232;stroke-width:5}.roof{fill:#7f2632;stroke:#2e3232;stroke-width:4}.trim{fill:none;stroke:#b56f4c;stroke-width:5}
      .window{fill:#c7d6d5;stroke:#2e3232;stroke-width:4}.estimate{fill:none;stroke:#b56f4c;stroke-width:2;stroke-dasharray:8 6}
      .dim{fill:none;stroke:#68706d;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}.ext{stroke:#68706d;stroke-width:2}
      .label{font-size:17px;font-weight:700}.small{font-size:14px}.tiny{font-size:12px}.view{font-size:21px;font-weight:700;fill:#315b50}
    </style>
  </defs>

  <rect width="1800" height="1300" fill="#fffdf8"/>
  <rect x="32" y="32" width="1736" height="1236" rx="8" fill="none" stroke="#2e3232" stroke-width="2"/>
  <text id="sheet-title" x="72" y="82" class="t green" font-size="34" font-weight="700">PHASE 1 • EXISTING REFERENCE SHELL • FOUR EXTERIOR ELEVATIONS</text>
  <text x="72" y="119" class="t" font-size="18">REPRESENTATIVE 1989 CIRCLE J TWO-HORSE STRAIGHT-LOAD • AS-OBSERVED / NO FABRICATION MODIFICATIONS</text>
  <line x1="72" y1="143" x2="1728" y2="143" stroke="#b56f4c" stroke-width="5"/>

  <!-- CURB / PASSENGER SIDE: scale 4.5 px/in, front at x=260, rear at x=800 -->
  <g id="curb-elevation">
