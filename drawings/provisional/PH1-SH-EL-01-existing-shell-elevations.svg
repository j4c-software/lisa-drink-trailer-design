    <path d="M260 230 Q275 204 315 204 H765 Q800 204 800 230 H260 Z" class="roof"/>
    <path d="M260 348 H800 M260 405 H800" class="trim"/>
    <path d="M260 275 Q278 258 327 267 V315 H260 Z" class="window"/>
    <rect x="359" y="270" width="95" height="45" rx="17" class="window"/>
    <rect x="593" y="263" width="198" height="70" rx="20" class="window"/>
    <rect x="593" y="263" width="198" height="70" rx="20" fill="url(#bars)" opacity="0.55"/>
    <line x1="359" y1="230" x2="359" y2="577" stroke="#68706d" stroke-width="2" opacity="0.45"/>
    <line x1="454" y1="230" x2="454" y2="577" stroke="#68706d" stroke-width="2" opacity="0.45"/>
    <line x1="593" y1="230" x2="593" y2="577" stroke="#68706d" stroke-width="2" opacity="0.45"/>
    <path d="M503 577 V477 Q503 448 532 448 H800 V577" fill="#ded8cd" stroke="#68706d" stroke-width="4"/>
    <circle cx="566" cy="512" r="65" fill="#2e3232"/>
    <circle cx="566" cy="512" r="31" fill="#ded8cd" stroke="#68706d" stroke-width="4"/>
    <circle cx="710" cy="512" r="65" fill="#2e3232"/>
    <circle cx="710" cy="512" r="31" fill="#ded8cd" stroke="#68706d" stroke-width="4"/>
    <path d="M260 523 L80 568 M260 552 L80 568" fill="none" stroke="#2e3232" stroke-width="9" stroke-linecap="round"/>
    <circle cx="73" cy="568" r="11" fill="#fffdf8" stroke="#2e3232" stroke-width="5"/>
    <line x1="115" y1="548" x2="115" y2="590" stroke="#68706d" stroke-width="7"/>
    <line x1="98" y1="590" x2="132" y2="590" stroke="#68706d" stroke-width="5"/>
    <text x="292" y="298" class="t green label" text-anchor="middle">W1</text>
    <text x="407" y="299" class="t green label" text-anchor="middle">W2</text>
    <text x="692" y="304" class="t green label" text-anchor="middle">W3</text>
    <text x="651" y="435" class="t gray tiny" text-anchor="middle">FENDER ≈X 54–120 • AXLES ≈X 68 / 100</text>
    <line x1="260" y1="614" x2="800" y2="614" class="dim"/>
    <line x1="260" y1="589" x2="260" y2="625" class="ext"/><line x1="800" y1="589" x2="800" y2="625" class="ext"/>
    <text x="530" y="607" class="t gray label" text-anchor="middle">120&quot; BODY LENGTH • LISTED</text>
    <line x1="835" y1="204" x2="835" y2="571" class="dim"/>
    <line x1="812" y1="204" x2="846" y2="204" class="ext"/><line x1="812" y1="571" x2="846" y2="571" class="ext"/>
    <text x="858" y="390" class="t gray label" text-anchor="middle" transform="rotate(90 858 390)">81.6&quot; BODY HEIGHT • LISTED</text>
    <text x="95" y="644" class="t rust small">TONGUE ≈34–40&quot; • W1 ≈15 × 9–10 • W2 ≈21 × 9–10 • W3 ≈44 × 14–16 • PHOTO EST.</text>
  </g>

