    <circle cx="784" cy="900" r="28" fill="#ded8cd" stroke="#68706d" stroke-width="4"/>
    <path d="M260 1043 L80 1088 M260 1072 L80 1088" fill="none" stroke="#2e3232" stroke-width="9" stroke-linecap="round"/>
    <circle cx="73" cy="1088" r="11" fill="#fffdf8" stroke="#2e3232" stroke-width="5"/>
    <text x="380" y="947" class="t green label" text-anchor="middle">D1</text>
    <text x="602" y="846" class="t green label" text-anchor="middle">W4</text>
    <text x="784" y="905" class="t" font-size="11" font-weight="700" text-anchor="middle" fill="#fffdf8">SPARE</text>
    <line x1="260" y1="1134" x2="800" y2="1134" class="dim"/>
    <line x1="260" y1="1109" x2="260" y2="1145" class="ext"/><line x1="800" y1="1109" x2="800" y2="1145" class="ext"/>
    <text x="530" y="1127" class="t gray label" text-anchor="middle">120&quot; BODY LENGTH • LISTED</text>
    <line x1="835" y1="724" x2="835" y2="1091" class="dim"/>
    <line x1="812" y1="724" x2="846" y2="724" class="ext"/><line x1="812" y1="1091" x2="846" y2="1091" class="ext"/>
    <text x="858" y="910" class="t gray label" text-anchor="middle" transform="rotate(90 858 910)">81.6&quot; BODY HEIGHT • LISTED</text>
    <text x="95" y="1164" class="t rust small">D1 ≈X 15–38 / 22 ±4 W × 72 ±4 H • W4 SIZE/LOCATION PHOTO EST. • CLEAR OPENINGS UNKNOWN</text>
  </g>

  <!-- FRONT ELEVATION -->
