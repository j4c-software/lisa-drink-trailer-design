<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">OPTION A • EL-02 • STREET / OPPOSITE WALL</title>
  <desc id="desc">Interior elevation looking toward the trailer-left equipment wall. Front and tongue are at image left. Existing forward side-door bay is permanently infilled for Option A.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#8B908D"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#8B908D" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="800" fill="#FFFDF8"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#2E3232" stroke-width="2"/>
  <text x="56" y="70" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#315B50">OPTION A • EL-02 • STREET / OPPOSITE WALL</text>
  <text x="56" y="100" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2E3232">INTERIOR ELEVATION • TRAILER LEFT WALL • FRONT / TONGUE AT IMAGE LEFT</text>
  <line x1="56" y1="118" x2="1144" y2="118" stroke="#B56F4C" stroke-width="4"/>

  <!-- Trailer side profile and visible tongue -->
  <path d="M120 650 L120 230 Q165 160 240 160 L935 160 Q1010 160 1055 230 L1055 650" fill="#F4EFE5" stroke="#2E3232" stroke-width="3"/>
  <path d="M120 604 L54 638 L54 650 L120 650 Z" fill="#DED8CD" stroke="#2E3232" stroke-width="4" stroke-linejoin="round"/>
  <line x1="54" y1="644" x2="38" y2="644" stroke="#2E3232" stroke-width="6" stroke-linecap="round"/>
  <circle cx="33" cy="644" r="7" fill="#FFFDF8" stroke="#2E3232" stroke-width="3"/>
  <rect x="76" y="594" width="30" height="28" rx="3" fill="#DED8CD" stroke="#2E3232" stroke-width="2"/>
  <text x="46" y="676" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#315B50">FRONT / TONGUE</text>

  <!-- Front support area -->
  <line x1="317" y1="175" x2="317" y2="650" stroke="#8B908D" stroke-width="1" stroke-dasharray="8 6"/>
  <rect x="138" y="340" width="161" height="270" fill="#DED8CD" stroke="#8B908D" stroke-dasharray="7 5"/>
  <text x="218" y="380" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#2E3232">FRONT BREAK</text>
  <text x="218" y="402" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#315B50">OPEN TO AISLE</text>

  <!-- Localized forward existing door bay, permanently infilled -->
  <rect x="342" y="255" width="150" height="395" fill="url(#hatch)" stroke="#9A4D43" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="348" y="261" width="138" height="43" fill="#FFFDF8"/>
  <text x="417" y="278" font-family="Arial,Helvetica,sans-serif" font-size="10.5" text-anchor="middle" font-weight="700" fill="#9A4D43">EXISTING SIDE-DOOR BAY</text>
  <text x="417" y="295" font-family="Arial,Helvetica,sans-serif" font-size="10.5" text-anchor="middle" font-weight="700" fill="#9A4D43">ENGINEERED INFILL • VERIFY</text>

  <!-- Upper service storage -->
  <rect x="520" y="245" width="175" height="90" fill="#FFFDF8" stroke="#315B50" stroke-width="2"/>
  <text x="608" y="282" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#315B50">SOAP / TOWELS</text>
  <rect x="715" y="225" width="160" height="110" fill="#FFFDF8" stroke="#315B50" stroke-width="2"/>
  <text x="795" y="270" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#315B50">ENCLOSED</text>
  <text x="795" y="289" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#315B50">CLEAN GLASS</text>
  <rect x="895" y="215" width="140" height="120" fill="#FFFDF8" stroke="#B56F4C" stroke-width="3"/>
  <text x="965" y="264" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#B56F4C">ILLUMINATED</text>
  <text x="965" y="284" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#B56F4C">BOTTLES</text>

  <!-- 90-inch equipment line, front to rear -->
  <rect x="317" y="456" width="98" height="194" fill="#315B50" stroke="#FFFDF8" stroke-width="2"/>
  <rect x="415" y="456" width="295" height="194" fill="#315B50" stroke="#FFFDF8" stroke-width="2"/>
  <rect x="710" y="456" width="197" height="194" fill="#315B50" stroke="#FFFDF8" stroke-width="2"/>
  <rect x="907" y="456" width="148" height="194" fill="#315B50" stroke="#FFFDF8" stroke-width="2"/>
  <line x1="317" y1="456" x2="1055" y2="456" stroke="#2E3232" stroke-width="6"/>
  <text x="366" y="545" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">HAND</text>
  <text x="366" y="636" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#FFFFFF">12&quot;</text>
  <text x="563" y="545" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2-COMP SINK</text>
  <text x="563" y="565" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">+ RIGHT DRAINBOARD</text>
  <text x="563" y="636" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#FFFFFF">36&quot;</text>
  <text x="809" y="545" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">COCKTAIL / ICE</text>
  <text x="809" y="565" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">STATION</text>
  <text x="809" y="636" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#FFFFFF">24&quot;</text>
  <text x="981" y="545" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">REFRIGERATOR</text>
  <text x="981" y="636" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#FFFFFF">18&quot;</text>

  <line x1="317" y1="690" x2="1055" y2="690" stroke="#8B908D" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="317" y1="682" x2="317" y2="698" stroke="#8B908D"/>
  <line x1="1055" y1="682" x2="1055" y2="698" stroke="#8B908D"/>
  <text x="686" y="683" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#8B908D">90&quot; EQUIPMENT ZONE • FRONT → REAR</text>

  <line x1="56" y1="725" x2="1144" y2="725" stroke="#2E3232"/>
  <text x="56" y="752" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#2E3232">REVISED CONCEPT • NOT FOR FABRICATION • FORMER DOOR INFILL REQUIRES ENGINEERING</text>
  <text x="1144" y="752" font-family="Arial,Helvetica,sans-serif" font-size="10.5" text-anchor="end" fill="#8B908D">VERIFY AGAINST ACQUIRED TRAILER</text>
</svg>
