<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">OPTION A • PL-01 • CONCEPT PLAN</title>
  <desc id="desc">Opposite-wall service bar with visible tongue at left, rear double doors at right, and service opening on the trailer right side when standing at the tongue facing rear.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#8B908D"/></marker>
  </defs>
  <rect width="1200" height="800" fill="#FFFDF8"/>
  <rect x="28" y="28" width="1144" height="744" fill="none" stroke="#2E3232" stroke-width="2"/>
  <text x="56" y="70" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#315B50">OPTION A • PL-01 • CONCEPT PLAN</text>
  <text x="56" y="100" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#2E3232">OPPOSITE-WALL SERVICE BAR • PHOTOGRAPHED TRAILER HANDEDNESS</text>
  <line x1="56" y1="118" x2="1144" y2="118" stroke="#B56F4C" stroke-width="4"/>

  <!-- Visible A-frame tongue and coupler -->
  <line x1="56" y1="400" x2="180" y2="260" stroke="#2E3232" stroke-width="9" stroke-linecap="round"/>
  <line x1="56" y1="400" x2="180" y2="540" stroke="#2E3232" stroke-width="9" stroke-linecap="round"/>
  <line x1="56" y1="400" x2="180" y2="400" stroke="#2E3232" stroke-width="7" stroke-linecap="round"/>
  <circle cx="49" cy="400" r="11" fill="#FFFDF8" stroke="#2E3232" stroke-width="5"/>
  <rect x="101" y="374" width="42" height="52" rx="5" fill="#DED8CD" stroke="#2E3232" stroke-width="3"/>
  <text x="100" y="445" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#315B50">TONGUE / FRONT</text>

  <!-- Trailer shell: 114-inch assumed clear length -->
  <rect x="180" y="225" width="870" height="350" fill="#F4EFE5" stroke="#2E3232" stroke-width="3" rx="16"/>
  <line x1="363" y1="225" x2="363" y2="575" stroke="#2E3232" stroke-width="3"/>

  <!-- Front employee support zone -->
  <text x="272" y="275" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#315B50">24&quot; FRONT SUPPORT</text>
  <text x="272" y="298" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" fill="#2E3232">EMPLOYEE BREAK</text>
  <rect x="211" y="325" width="122" height="66" rx="6" fill="#DED8CD" stroke="#8B908D"/>
  <text x="272" y="353" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#2E3232">SLIDING</text>
  <text x="272" y="372" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#2E3232">PARTITION</text>
  <rect x="220" y="430" width="104" height="64" fill="#FFFDF8" stroke="#9A4D43" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="272" y="457" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" font-weight="700" fill="#9A4D43">DRY / ELECTRIC</text>
  <text x="272" y="476" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" font-weight="700" fill="#9A4D43">VERIFY</text>

  <!-- Rear double doors -->
  <line x1="1050" y1="249" x2="1050" y2="372" stroke="#B56F4C" stroke-width="7"/>
  <line x1="1050" y1="428" x2="1050" y2="551" stroke="#B56F4C" stroke-width="7"/>
  <text x="1062" y="393" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#B56F4C">REAR</text>
  <text x="1062" y="411" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#B56F4C">DOUBLE</text>
  <text x="1062" y="429" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#B56F4C">DOORS</text>

  <!-- Trailer left / existing door side -->
  <text x="615" y="211" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#315B50">TRAILER LEFT • STREET / UTILITY / EQUIPMENT SIDE</text>
  <line x1="379" y1="225" x2="516" y2="225" stroke="#9A4D43" stroke-width="8" stroke-dasharray="12 7"/>
  <text x="447" y="244" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#9A4D43">EXISTING SIDE-DOOR BAY</text>
  <text x="447" y="258" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#9A4D43">ENGINEERED INFILL • VERIFY</text>

  <!-- 90-inch equipment line, front to rear -->
  <rect x="363" y="225" width="92" height="150" fill="#577A86" stroke="#FFFDF8" stroke-width="2"/>
  <rect x="455" y="225" width="275" height="150" fill="#577A86" stroke="#FFFDF8" stroke-width="2"/>
  <rect x="730" y="225" width="183" height="150" fill="#315B50" stroke="#FFFDF8" stroke-width="2"/>
  <rect x="913" y="225" width="137" height="150" fill="#6F8B80" stroke="#FFFDF8" stroke-width="2"/>
  <rect x="363" y="225" width="687" height="150" fill="none" stroke="#B56F4C" stroke-width="3"/>
  <text x="409" y="294" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">HAND</text>
  <text x="409" y="313" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">SINK</text>
  <text x="409" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#FFFFFF">12&quot;</text>
  <text x="592" y="294" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">2-COMP SINK</text>
  <text x="592" y="313" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">+ RIGHT DRAINBOARD</text>
  <text x="592" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#FFFFFF">36&quot;</text>
  <text x="822" y="294" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">COCKTAIL / ICE</text>
  <text x="822" y="313" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#FFFFFF">STATION</text>
  <text x="822" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#FFFFFF">24&quot;</text>
  <text x="982" y="305" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" font-weight="700" fill="#FFFFFF">REFRIGERATOR</text>
  <text x="982" y="360" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#FFFFFF">18&quot;</text>
  <text x="706" y="393" font-family="Arial,Helvetica,sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#315B50">90&quot; OPPOSITE-WALL EQUIPMENT LINE • FRONT → REAR</text>

  <!-- Aisle and conditional roof escape -->
  <text x="790" y="432" font-family="Arial,Helvetica,sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#2E3232">32&quot; NOMINAL CLEAR AISLE</text>
  <text x="790" y="453" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" fill="#8B908D">TRAVEL CASES ONLY WHILE TOWING</text>
  <rect x="385" y="395" width="183" height="66" fill="#FFFDF8" stroke="#9A4D43" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="477" y="422" font-family="Arial,Helvetica,sans-serif" font-size="11" text-anchor="middle" font-weight="700" fill="#9A4D43">ROOF ESCAPE HATCH</text>
  <text x="477" y="441" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#9A4D43">FORWARD LOCATION • VERIFY</text>

  <!-- Trailer right / photographed large-window bay -->
  <line x1="478" y1="575" x2="936" y2="575" stroke="#B56F4C" stroke-width="9"/>
  <line x1="478" y1="564" x2="478" y2="588" stroke="#9A4D43" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="936" y1="564" x2="936" y2="588" stroke="#9A4D43" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="707" y="532" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#B56F4C">SERVICE HATCH WITHIN EXISTING PHOTOGRAPHED WINDOW BAY</text>
  <text x="707" y="550" font-family="Arial,Helvetica,sans-serif" font-size="10.5" text-anchor="middle" font-weight="700" fill="#9A4D43">60&quot; MAXIMUM CONCEPT • EXACT JAMBS / HEADER / WIDTH VERIFY</text>
  <rect x="478" y="579" width="458" height="28" fill="#6F8B80" stroke="#315B50" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="707" y="598" font-family="Arial,Helvetica,sans-serif" font-size="10.5" text-anchor="middle" font-weight="700" fill="#FFFFFF">6&quot; OUTBOARD DRY STORAGE • EXTENT / FENDER CLEARANCE VERIFY</text>
  <text x="615" y="630" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#315B50">TRAILER RIGHT • CURB / SERVICE / CUSTOMER SIDE</text>

  <!-- Photo-based tandem-fender constraint -->
  <rect x="730" y="640" width="252" height="24" rx="12" fill="none" stroke="#8B908D" stroke-width="2" stroke-dasharray="7 5"/>
  <circle cx="804" cy="652" r="9" fill="none" stroke="#8B908D" stroke-width="2"/>
  <circle cx="908" cy="652" r="9" fill="none" stroke="#8B908D" stroke-width="2"/>
  <text x="856" y="681" font-family="Arial,Helvetica,sans-serif" font-size="10" text-anchor="middle" font-weight="700" fill="#8B908D">TANDEM FENDER / STRUCTURAL ZONE • PHOTO LOCATION ONLY • VERIFY</text>

  <!-- Overall assumed dimensions -->
  <line x1="180" y1="702" x2="363" y2="702" stroke="#8B908D" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="272" y="695" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#8B908D">24&quot;</text>
  <line x1="363" y1="702" x2="1050" y2="702" stroke="#8B908D" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="706" y="695" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#8B908D">90&quot;</text>
  <line x1="180" y1="721" x2="1050" y2="721" stroke="#8B908D" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="615" y="716" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#8B908D">114&quot; ASSUMED INTERIOR CLEAR LENGTH</text>

  <line x1="56" y1="734" x2="1144" y2="734" stroke="#2E3232"/>
  <text x="56" y="757" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" fill="#2E3232">REVISED CONCEPT • NOT FOR FABRICATION • PHOTO PROXY IS NOT STRUCTURAL EVIDENCE</text>
  <text x="1144" y="757" font-family="Arial,Helvetica,sans-serif" font-size="10.5" text-anchor="end" fill="#8B908D">ALL DIMENSIONS AND OPENINGS REQUIRE DONOR FIELD SURVEY</text>
</svg>
